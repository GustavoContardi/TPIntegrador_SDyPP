# A-02: restringe el ingress a Redis. Al seleccionar los pods de Redis, esta
# policy los pone en modo default-deny y solo admite a los clientes legítimos:
# HAProxy (la entrada de todos los clientes, ver redis-haproxy.yaml), Sentinel y
# las otras réplicas (sin ellas no pueden sincronizar desde el master). NCT y
# API siguen admitidos directo para no cortarlos mientras se redespliegan con la
# URL nueva; en régimen entran por HAProxy.
#
# El acceso desde afuera (LoadBalancer de los workers del k3s) ya no llega acá:
# redis-external apunta a HAProxy, y su policy es redis-haproxy-allow-clients.
#
# Se aplica desde septiembre (antes el clúster no tenía enforcement). Si algo
# deja de conectar después de un redespliegue, `kubectl delete networkpolicy
# -n voxchain --all` vuelve al comportamiento anterior mientras se diagnostica.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-allow-clients
  namespace: voxchain
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["redis-haproxy", "redis-sentinel", "redis", "nct-primary", "nct-standby", "voxchain-api"]
      ports:
        - protocol: TCP
          port: 6379
---
# HAProxy es ahora la entrada de todos los clientes de Redis. El ipBlock
# 0.0.0.0/0 es el LoadBalancer externo (workers del k3s): con Dataplane V2 un
# CIDR sólo cubre tráfico de fuera del clúster, y para que llegue con la IP real
# el Service usa externalTrafficPolicy: Local. Quién llega al LoadBalancer lo
# acota loadBalancerSourceRanges (02-services, K3S_EGRESS_CIDRS); la
# autenticación sigue siendo la contraseña de Redis, que HAProxy no toca.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-haproxy-allow-clients
  namespace: voxchain
spec:
  podSelector:
    matchLabels:
      app: redis-haproxy
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: ["nct-primary", "nct-standby", "voxchain-api"]
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: g-git-push-cv
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 6379
