apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: voxchain
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      # Corre en el nodepool "infra" (tainted pool=infra:NoSchedule en Terraform)
      nodeSelector:
        pool: infra
      tolerations:
        - key: pool
          operator: Equal
          value: infra
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: redis-sentinel
                topologyKey: kubernetes.io/hostname
      containers:
        - name: sentinel
          image: redis:7-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          # Dos cosas que el arranque anterior hacía mal:
          #  - Monitoreaba siempre a redis-0. Después de un failover, un Sentinel
          #    que se reiniciaba vigilaba a una réplica como si fuera el master.
          #    Ahora pregunta primero a los otros Sentinel, después busca entre
          #    los Redis al que diga ser master, y sólo en un clúster nuevo cae
          #    en redis-0.
          #  - El myid salía al azar en cada arranque. Los otros Sentinel
          #    conservaban el id viejo como un par más que nunca vota, y la
          #    mayoría para elegir quién hace el failover se volvía inalcanzable
          #    tras unos pocos reinicios. Derivado del nombre del pod, un
          #    Sentinel reiniciado vuelve con el mismo id y los otros sólo le
          #    actualizan la IP.
          command:
            - /bin/sh
            - -c
            - |
              HEADLESS=redis-headless.voxchain.svc.cluster.local
              cli() { timeout 3 redis-cli -a "$REDIS_PASSWORD" --no-auth-warning "$@" 2>/dev/null; }
              MYID=$(printf '%s' "$POD_NAME" | sha1sum | cut -c1-40)

              while :; do
                MASTER=$(timeout 3 redis-cli -h redis-sentinel -p 26379 SENTINEL get-master-addr-by-name mymaster 2>/dev/null | head -n 1)
                if [ -z "$MASTER" ]; then
                  MEJOR=-1
                  for n in 0 1 2; do
                    INFO=$(cli -h "redis-$n.$HEADLESS" INFO replication)
                    echo "$INFO" | grep -q '^role:master' || continue
                    R=$(echo "$INFO" | grep '^connected_slaves:' | cut -d: -f2 | tr -d '\r')
                    if [ "${R:-0}" -gt "$MEJOR" ]; then
                      MEJOR=${R:-0}
                      MASTER=$(getent hosts "redis-$n.$HEADLESS" | awk '{print $1}')
                    fi
                  done
                fi
                [ -n "$MASTER" ] && break
                echo "esperando a que haya un master de Redis"; sleep 2
              done
              echo "monitoreo a $MASTER"

              cat > /tmp/sentinel.conf << EOF
              port 26379
              sentinel myid $MYID
              sentinel monitor mymaster $MASTER 6379 2
              sentinel auth-pass mymaster $REDIS_PASSWORD
              sentinel down-after-milliseconds mymaster 5000
              sentinel failover-timeout mymaster 10000
              sentinel parallel-syncs mymaster 1
              EOF
              exec redis-sentinel /tmp/sentinel.conf
          ports:
            - containerPort: 26379
              name: sentinel
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -p 26379 ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -p 26379 ping
            initialDelaySeconds: 5
            periodSeconds: 5
