apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-credentials
  namespace: g-git-push-cv
type: Opaque
stringData:
  # Plantilla vacía, igual que redis-credentials y rabbitmq-ca: el valor real lo
  # crea 04-gpu-workers con `kubectl create secret` desde GitHub Secrets
  # (RABBITMQ_USER/RABBITMQ_PASS). Hasta septiembre este archivo tenía una
  # contraseña literal que gitleaks no detectaba por no ir entre comillas; se
  # quitó, se agregó la regla hardcoded-credential-yaml-unquoted y la contraseña
  # se rota al redesplegar (bootstrap-secrets.sh --rotate).
  username: voxchain-worker
  password: ""
  keda-host: ""
