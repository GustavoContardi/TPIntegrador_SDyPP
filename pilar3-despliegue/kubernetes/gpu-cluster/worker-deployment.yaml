apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: g-git-push-cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: pool
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              # Para minar con GPU, descomentar esta línea Y las dos variables
              # NVIDIA de más abajo. Las dos cosas van juntas: pedir el recurso
              # sin las variables no expone la placa, y poner las variables sin
              # pedir el recurso hace que el pod falle al crearse en cualquier
              # nodo sin driver. Sin nada de esto, el minero detecta que no hay
              # GPU utilizable y cae al minero de CPU, que es el comportamiento
              # por defecto y el que se usa hoy.
              # nvidia.com/gpu: 1
          env:
            # - name: NVIDIA_VISIBLE_DEVICES
            #   value: "all"
            # - name: NVIDIA_DRIVER_CAPABILITIES
            #   value: "compute,utility"
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            # AMQPS: el LoadBalancer externo de RabbitMQ solo expone 5671 (TLS).
            # SERVER_NAME valida el cert por su SAN DNS aunque la URL use la IP.
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/rabbitmq-ca/ca.crt
            - name: RABBITMQ_TLS_SERVER_NAME
              value: rabbitmq.voxchain.svc.cluster.local
            - name: REDIS_URL
              value: ""
            - name: WORKER_MODE
              value: "pool-auto"
            - name: POOL_ID
              value: "default"
            - name: WORKER_ADDRESS
              value: "http://$(MY_POD_IP):9001"
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca
