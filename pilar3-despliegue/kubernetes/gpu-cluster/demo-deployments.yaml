# ──────────────────────────────────────────────────────────────────────────────
# demo-deployments.yaml — Escenario demo: 5 nodos precargados en k3s-cluster
#
# Grafo de conexión:
#   valentin    → worker-standalone     (standalone, autónomo)
#   gustavo     → worker-pool-coordinator (pool-coordinator, líder del pool)
#   matt        → worker-pool-miner-1   (pool-worker bajo gustavo)
#   profesor1   → worker-pool-miner-2   (pool-worker bajo gustavo)
#   profesor2   → worker-pool-miner-3   (pool-worker bajo gustavo)
#
# Todos los workers reportan su estado periódicamente a Redis (en GKE) mediante
# la clave worker:status:<worker_id> (TTL 15 s). El backend voxchain-api lee
# esas claves para servir el estado al frontend sin necesidad de acceso directo
# al cluster k3s.
# ──────────────────────────────────────────────────────────────────────────────

# ── 1. STANDALONE — usuario: valentin ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-standalone
  namespace: g-git-push-cv
  labels:
    demo-user: valentin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-standalone
  template:
    metadata:
      labels:
        app: worker-standalone
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9090
              name: admin
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: WORKER_ID
              value: "worker-standalone"
            - name: WORKER_MODE
              value: "standalone"
            # El espacio de nonces tiene que cubrir la derogación (n+1=7) o las
            # ventanas vencen sin sellar. Estos pods no leen el ConfigMap
            # `voxchain-config` (vive en otro namespace), así que va explícito.
            - name: NONCE_SPACE
              value: "1250000000"
            - name: FRAGMENT_SIZE
              value: "25000000"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            # AMQPS: el LoadBalancer externo de RabbitMQ solo expone 5671 (TLS).
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/rabbitmq-ca/ca.crt
            - name: RABBITMQ_TLS_SERVER_NAME
              value: rabbitmq.voxchain.svc.cluster.local
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0"
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
            - name: WORKER_PRIVKEY_PEM
              value: /keys/privkey.pem
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
            - name: privkey
              mountPath: /keys
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca
        - name: privkey
          secret:
            secretName: worker-privkeys
            items:
              - key: valentin.pem
                path: privkey.pem
---
# ── 2. POOL COORDINATOR — usuario: gustavo ───────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-pool-coordinator
  namespace: g-git-push-cv
  labels:
    demo-user: gustavo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-pool-coordinator
  template:
    metadata:
      labels:
        app: worker-pool-coordinator
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: pool
            - containerPort: 9090
              name: admin
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: WORKER_ID
              value: "worker-pool-coordinator"
            - name: WORKER_MODE
              value: "pool-coordinator"
            # El espacio de nonces tiene que cubrir la derogación (n+1=7) o las
            # ventanas vencen sin sellar. Estos pods no leen el ConfigMap
            # `voxchain-config` (vive en otro namespace), así que va explícito.
            - name: NONCE_SPACE
              value: "1250000000"
            - name: FRAGMENT_SIZE
              value: "25000000"
            # Dificultad del mini-PoW de elección de coordinador. Es el nombre
            # que leen bully.py y pool_coordinator/coordinator.py; NO es
            # N_ZEROS (la dificultad de gobierno, que fija el NCT).
            - name: POOL_ELECTION_N_ZEROS
              value: "2"
            - name: POOL_HTTP_PORT
              value: "9001"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            # AMQPS: el LoadBalancer externo de RabbitMQ solo expone 5671 (TLS).
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/rabbitmq-ca/ca.crt
            - name: RABBITMQ_TLS_SERVER_NAME
              value: rabbitmq.voxchain.svc.cluster.local
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0"
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca
---
# Service para que los pool-miners encuentren al coordinator dentro del namespace
apiVersion: v1
kind: Service
metadata:
  name: worker-pool-coordinator
  namespace: g-git-push-cv
spec:
  selector:
    app: worker-pool-coordinator
  ports:
    - name: pool
      port: 9001
      targetPort: 9001
    - name: admin
      port: 9090
      targetPort: 9090
---
