apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: g-git-push-cv

# Los *-secret.yaml de este directorio son plantillas vacías: los valores los
# crea 04-gpu-workers con `kubectl create secret`. No van en resources porque un
# `kubectl apply -k` pisaría los secretos reales con strings vacíos.
resources:
  - namespace.yaml
  - worker-config.yaml
  - worker-deployment.yaml
  - worker-modes-configmap.yaml
  - worker-rbac.yaml
  - backend-proxy-rbac.yaml
