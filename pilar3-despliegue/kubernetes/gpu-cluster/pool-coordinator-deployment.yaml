apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-coordinator
  namespace: g-git-push-cv
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pool-coordinator
  template:
    metadata:
      labels:
        app: pool-coordinator
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pool-coordinator
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            # Sólo /tmp y los logs son escribibles (emptyDir).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
            - containerPort: 9001
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            # AMQPS: el LoadBalancer externo de RabbitMQ solo expone 5671 (TLS).
            # SERVER_NAME valida el cert por su SAN DNS aunque la URL use la IP.
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/rabbitmq-ca/ca.crt
            - name: RABBITMQ_TLS_SERVER_NAME
              value: rabbitmq.voxchain.svc.cluster.local
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis.voxchain.svc.cluster.local:6379/0"
            - name: WORKER_MODE
              value: "pool-coordinator"
            # Identidad de nodo (AGENT.md 3.1): el pod genera su par acá al
            # arrancar y firma sus nonces. Sin ella, con REQUIRE_SIGNATURES el
            # NCT descarta sus respuestas. Volumen en memoria: la clave nace y
            # muere con el pod (mismo esquema que gpu-miner y "Register Worker").
            - name: WORKER_PRIVKEY_PEM
              value: /app/keys/node-key.pem
            # El espacio de nonces tiene que cubrir la derogación (n+1=7) o las
            # ventanas vencen sin sellar. Estos pods no leen el ConfigMap
            # `voxchain-config` (vive en otro namespace), así que va explícito.
            - name: NONCE_SPACE
              value: "1250000000"
            - name: FRAGMENT_SIZE
              value: "25000000"
            # Dificultad del mini-PoW de elección de coordinador. Es el nombre
            # que leen bully.py y pool_coordinator/coordinator.py; NO es
            # N_ZEROS (la dificultad de gobierno, que fija el NCT).
            - name: POOL_ELECTION_N_ZEROS
              value: "2"
            - name: POOL_HTTP_PORT
              value: "9001"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: keys
              mountPath: /app/keys
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/voxchain
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
      volumes:
        - name: keys
          emptyDir:
            medium: Memory
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca