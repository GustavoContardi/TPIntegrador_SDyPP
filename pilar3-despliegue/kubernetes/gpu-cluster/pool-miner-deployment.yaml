apiVersion: apps/v1
kind: Deployment
metadata:
  name: pool-miner
  namespace: g-git-push-cv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pool-miner
  template:
    metadata:
      labels:
        app: pool-miner
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pool-miner
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/worker-gpu:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
          resources:
            requests:
              cpu: "500m"
              memory: "256Mi"
            limits:
              memory: "512Mi"
          env:
            - name: WORKER_MODE
              value: "pool-worker"
            # El espacio de nonces tiene que cubrir la derogación (n+1=7) o las
            # ventanas vencen sin sellar. Estos pods no leen el ConfigMap
            # `voxchain-config` (vive en otro namespace), así que va explícito.
            - name: NONCE_SPACE
              value: "1250000000"
            - name: FRAGMENT_SIZE
              value: "25000000"
            - name: POOL_COORDINATOR_URL
              value: "http://pool-coordinator:9001"
            # El worker conecta messaging en todos los modos (recibe comandos
            # switch_mode por RabbitMQ) y reporta su estado a Redis en GKE.
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: rabbitmq-host
            - name: RABBITMQ_URL
              value: "amqps://$(RABBITMQ_USER):$(RABBITMQ_PASS)@$(RABBITMQ_HOST):5671/"
            - name: RABBITMQ_TLS_CA_PATH
              value: /etc/rabbitmq-ca/ca.crt
            - name: RABBITMQ_TLS_SERVER_NAME
              value: rabbitmq.voxchain.svc.cluster.local
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: worker-config
                  key: redis-host
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):6379/0"
            - name: WORKER_CAPACITY
              value: "1"
            - name: LOG_DIR
              value: /var/log/voxchain
            - name: MINER_CPU_SCRIPT
              value: /app/pilar1-minero/cpu/src/brute_force.py
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
            - name: rabbitmq-ca
              mountPath: /etc/rabbitmq-ca
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        - name: rabbitmq-ca
          secret:
            secretName: rabbitmq-ca