apiVersion: v1
kind: ConfigMap
metadata:
  name: voxchain-config
  namespace: voxchain
data:
  # Dificultad de gobierno. NO es una perilla suelta: se mueve junto con
  # NONCE_SPACE (el espacio tiene que cubrir la derogación, n+1) y con
  # WINDOW_SECONDS_DEROGACION. Ver la tabla del README de Pilar 3 antes de
  # tocarla; el NCT avisa por log si la combinación es incoherente.
  # n=6 ⇒ ~18 s de CPU para promulgar, ~280 s para derogar (a 954 kH/s).
  N_ZEROS: "6"
  # Dificultad DINÁMICA (AGENT.md 3.6 / 11): `n` se recalcula en cada ventana
  # según el cómputo vivo, para que promulgar cueste siempre ~TARGET_SECONDS sin
  # importar cuántos mineros se registren. N_ZEROS pasa a ser sólo el valor
  # inicial. Con "false" vuelve al `n` fijo del enunciado original.
  DYNAMIC_DIFFICULTY: "true"
  DIFFICULTY_TARGET_SECONDS: "60"
  # Deliberación (AGENT.md 3.12): pausa entre anunciar la ley y abrir su
  # ventana, para que cada equipo convocado decida si aporta cómputo. La
  # dificultad y el plazo se congelan al anunciar, sobre el equipo más grande
  # que vota esa área; el plazo es FACTOR × su tiempo esperado, acotado por
  # WINDOW_MIN_SECONDS y WINDOW_SECONDS_<acción>.
  DELIBERATION_SECONDS: "120"
  WINDOW_DEADLINE_FACTOR: "2"
  WINDOW_MIN_SECONDS: "20"
  # Pausas seguidas sin ninguna respuesta antes de descartar la ley "sin
  # respuesta" (sin penalidad de reproposición). Corta el reanuncio infinito.
  MAX_SILENT_DELIBERATIONS: "3"
  # Ventanas seguidas midiendo una red más chica antes de bajar `n`. Sube en el
  # acto; baja despacio, porque bajar es lo único que le sirve a un atacante
  # (conectar cómputo, dejar subir n, apagarlo y promulgar barato). El estado del
  # trinquete vive en Redis (`nct:difficulty`) y sobrevive al failover del NCT:
  # sin eso, forzar una caída era la forma de saltearse la histéresis.
  DIFFICULTY_DECAY_WINDOWS: "3"
  # H/s a suponerle a un minero que todavía no reportó medición propia.
  HPS_CPU: "954180"
  HPS_GPU: "500000000"
  # Firma de propuestas (A-01 / AGENT.md 3.1). Migración: arrancar en "false"
  # (acepta no firmadas y loguea; una firma inválida siempre se rechaza) y pasar
  # a "true" cuando todos los productores firman. Debe quedar igual en NCT y API.
  REQUIRE_SIGNATURES: "false"
  # Anti-replay: antigüedad máxima de created_at en una propuesta firmada (segundos).
  PROPOSAL_MAX_AGE_SECONDS: "300"
  WINDOW_SECONDS_PROMULGACION: "120"
  # 280 s esperados para derogar con n=7 no entran en 180 s. Con deliberación
  # es el techo del plazo congelado: derogar cuesta n+1, hasta 16 × 60 s para
  # el más grande, y el factor 2 lo duplica.
  WINDOW_SECONDS_DEROGACION: "1200"
  COOLDOWN_WINDOWS_NEW: "4"
  # Cuota de turnos por identidad (AGENT.md 3.3): una identidad que se llevó
  # más de MAX_SHARE de las últimas WINDOWS ventanas cede el turno. Acota el
  # monopolio sostenido; no cierra Sybil (AGENT.md 9).
  TURN_QUOTA_WINDOWS: "10"
  TURN_QUOTA_MAX_SHARE: "0.5"
  # Quórum de mineros para abrir una ventana. Si no hay al menos esta cantidad
  # de mineros vivos capaces de minar el ÁREA de la ley (un equipo que sólo vota
  # "economia" no cuenta para una ley de "salud"), el NCT no abre la ventana: la
  # ley se queda en la cola y el sistema se declara no disponible, en vez de
  # abrir una ventana que va a vencer sí o sí y descartar la ley por falta de
  # red. Tiene que ser el MISMO valor en NCT y API (el API sólo lo usa para
  # avisarle al ciudadano). 0 = desactivado (comportamiento previo).
  MIN_WORKERS_FOR_WINDOW: "1"
  # Si ese quórum mira la AGENDA de los equipos o sólo cuenta mineros vivos.
  # "true": una ley de un área que ningún equipo vota también espera en la cola.
  # "false": el gate cubre sólo la red vacía, y un área desierta vuelve a hacer
  # expirar la ley, que es el veto político deliberado de AGENT.md 3.10.
  QUORUM_BY_CATEGORY: "true"
  # Quién puede proponer leyes (AGENT.md 3.2). "true": sólo el fundador de un
  # equipo o el dueño de un minero standalone; un ciudadano sin minero o un
  # miembro de equipo reciben 403. "false": cualquier identidad, como antes (lo
  # necesitan los inyectores de carga, que proponen con identidades inventadas).
  # Compartido por NCT y API.
  RESTRICT_PROPOSERS: "true"
  HEARTBEAT_INTERVAL: "3"
  HEARTBEAT_TIMEOUT: "12"
  LEADER_LEASE_TTL: "15"
  # 99% de probabilidad de que exista solución para una derogación (n+1=7).
  NONCE_SPACE: "1250000000"
  # Techo de paralelismo de un pool: NONCE_SPACE/FRAGMENT_SIZE = 50 fragmentos.
  # Un equipo con más miembros que fragmentos NO va más rápido, así que este
  # cociente es la ventaja máxima que puede sacarle el pool más grande a un
  # minero solo. Subirlo ensancha la concentración de poder (AGENT.md 9).
  FRAGMENT_SIZE: "25000000"
  HEALTH_PORT: "8080"
  WORKER_CAPACITY: "1"
  PORT: "8000"
