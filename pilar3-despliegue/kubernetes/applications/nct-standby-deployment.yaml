apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct-standby
  namespace: voxchain
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nct-standby
  template:
    metadata:
      labels:
        app: nct-standby
        component: nct
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nct
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/nct:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: health
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-0.redis-headless.voxchain.svc.cluster.local:6379/0"
            - name: NCT_MODE
              value: "standby"
            - name: NCT_ID
              value: "nct-standby-1"
            - name: LOG_DIR
              value: "/var/log/voxchain"
          envFrom:
            - configMapRef:
                name: voxchain-config
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
          # Readiness = liderazgo: /health devuelve 200 solo en el líder, así el
          # Service `nct` (selector component=nct) enruta únicamente al líder.
          # El follower queda 0/1 a propósito (liveness sigue siendo TCP para
          # que no lo mate kubelet).
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
      volumes:
        - name: logs
          emptyDir: {}
