apiVersion: apps/v1
kind: Deployment
metadata:
  name: voxchain-api
  namespace: voxchain
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voxchain-api
  template:
    metadata:
      labels:
        app: voxchain-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images/voxchain-api:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: RABBITMQ_URL
              value: "amqp://$(RABBITMQ_USER):$(RABBITMQ_PASS)@rabbitmq:5672/"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-credentials
                  key: password
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis-0.redis-headless.voxchain.svc.cluster.local:6379/0"
            - name: NCT_HEALTH_URL
              value: "http://nct:8080/health"
            - name: LOG_DIR
              value: "/var/log/voxchain"
            # Spawn dinámico de workers (Register Worker): la API crea el
            # Deployment en el cluster k3s EXTERNO usando este kubeconfig;
            # WORKER_NAMESPACE fija el namespace destino (≠ del namespace
            # del propio pod).
            - name: KUBECONFIG
              value: /etc/k3s/kubeconfig
            - name: WORKER_NAMESPACE
              value: g-git-push-cv
          envFrom:
            - configMapRef:
                name: voxchain-config
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: logs
              mountPath: /var/log/voxchain
            - name: k3s-kubeconfig
              mountPath: /etc/k3s
              readOnly: true
      volumes:
        - name: logs
          emptyDir: {}
        # Secret creado fuera del repo:
        # kubectl create secret generic k3s-kubeconfig -n voxchain \
        #   --from-file=kubeconfig=<kubeconfig del namespace k3s>
        - name: k3s-kubeconfig
          secret:
            secretName: k3s-kubeconfig
            optional: true
