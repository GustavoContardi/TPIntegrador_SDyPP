apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: voxchain-alerts
  namespace: voxchain
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: voxchain.consenso
      rules:
        - alert: VoxchainSinLiderNCT
          expr: max(voxchain_nct_is_leader) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Ningún NCT es líder"
            description: >-
              Hace más de 1 minuto que ningún NCT tiene el lease de liderazgo.
              El failover por lease Redis debería resolverse en ~12 s
              (HEARTBEAT_TIMEOUT); si esta alerta dispara, revisar Redis
              (¿mayoría de réplicas caída?) y los pods nct-primary/nct-standby.
        - alert: VoxchainNCTSinMetricas
          expr: absent(voxchain_nct_is_leader)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Prometheus no scrapea ningún NCT"
            description: >-
              No llegan métricas de ningún NCT hace 2 minutos: los pods están
              caídos o el ServiceMonitor no los descubre.
        - alert: VoxchainVentanasSinSellar
          expr: >-
            increase(voxchain_nct_windows_opened_total[30m]) > 0
            and increase(voxchain_nct_blocks_sealed_total[30m]) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Se abren ventanas pero no se sella ningún bloque"
            description: >-
              En los últimos 30 minutos hubo ventanas de votación abiertas pero
              ningún bloque sellado: las ventanas están venciendo. Puede indicar
              que no hay workers minando, que la dificultad (N_ZEROS) es muy alta
              para la capacidad disponible, o que respuesta_nonce no fluye.
    - name: voxchain.mineria
      rules:
        - alert: VoxchainSinGPU
          # voxchain_miner_* lo exporta el API desde worker:status en Redis:
          # Prometheus no alcanza el /metrics de los mineros del k3s.
          expr: max(voxchain_miner_has_gpu) == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Ningún worker reporta GPU disponible"
            description: >-
              Hace 10 minutos que ningún worker tiene GPU: el sistema está
              minando solo con CPU (fallback activo). Las ventanas tardarán más
              o vencerán si la dificultad es alta. Verificar el cluster k3s y el
              binario CUDA.
        - alert: VoxchainLatenciaDesafioAlta
          # Antes usaba voxchain_worker_challenge_latency_seconds, que Prometheus
          # nunca scrapea (los mineros están en el k3s): la alerta no podía
          # disparar. voxchain_miner_* lo exporta el API desde el latido; las 2
          # réplicas del API lo repiten, de ahí el max by antes de sumar.
          expr: >-
            histogram_quantile(0.99,
              sum by (le) (max by (worker_id, resource, le) (
                rate(voxchain_miner_challenge_latency_seconds_bucket[10m])))) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Latencia RabbitMQ → worker p99 > 5 s"
            description: >-
              Los desafíos tardan más de 5 s (p99) en llegar del NCT a los
              workers. Revisar la salud del cluster RabbitMQ y la red entre
              clusters (LoadBalancer AMQPS).
    # Redis y RabbitMQ no tenían alerta propia. Con Sentinel + HAProxy la caída
    # de un pod se resuelve sola (pausa de ~10 s), así que el sistema sigue y
    # nadie se entera de que se perdió redundancia; y si se caía todo, lo único
    # que avisaba era "no hay líder NCT", lejos de la causa.
    #
    # Salen de kube-state-metrics (réplicas listas contra deseadas). El `max by`
    # descarta los labels del pod de kube-state-metrics: sin él, la identidad de
    # la alerta cambiaría cada vez que ese pod se reinicia. `componente` unifica
    # el nombre de StatefulSets y Deployments para el mensaje.
    #
    # Las "degradadas" esperan 1 min. Con más (se probó con 10) no avisan
    # durante un reinicio rodante normal (un `kubectl apply` de 02-services, un
    # nodo que se drena), pero tampoco se pueden mostrar en una demo. El costo
    # de 1 min es que un reinicio rodante manda un "degradado" y enseguida su
    # "resuelta".
    - name: voxchain.infraestructura
      rules:
        - alert: VoxchainRedisDegradado
          expr: >-
            label_replace(
              max by (statefulset) (kube_statefulset_status_replicas_ready{namespace="voxchain", statefulset=~"redis|redis-sentinel"})
                < max by (statefulset) (kube_statefulset_replicas{namespace="voxchain", statefulset=~"redis|redis-sentinel"}),
              "componente", "$1", "statefulset", "(.*)")
            or
            label_replace(
              max by (deployment) (kube_deployment_status_replicas_available{namespace="voxchain", deployment="redis-haproxy"})
                < max by (deployment) (kube_deployment_spec_replicas{namespace="voxchain", deployment="redis-haproxy"}),
              "componente", "$1", "deployment", "(.*)")
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Redis perdió redundancia: {{ $labels.componente }}"
            description: >-
              {{ $labels.componente }} tiene {{ $value }} réplicas listas, menos
              de las esperadas, hace más de 1 minuto. El sistema sigue andando
              (Sentinel y HAProxy cubren la caída de un pod), pero otra falla
              podría dejarlo sin Redis. Revisar los pods y los eventos del
              StatefulSet o Deployment en el namespace voxchain.
        - alert: VoxchainRedisCaido
          expr: >-
            label_replace(
              max by (statefulset) (kube_statefulset_status_replicas_ready{namespace="voxchain", statefulset="redis"}) == 0,
              "componente", "$1", "statefulset", "(.*)")
            or
            label_replace(
              max by (deployment) (kube_deployment_status_replicas_available{namespace="voxchain", deployment="redis-haproxy"}) == 0,
              "componente", "$1", "deployment", "(.*)")
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Redis inalcanzable: {{ $labels.componente }} sin réplicas listas"
            description: >-
              No queda ninguna réplica lista de {{ $labels.componente }}. Sin
              Redis (o sin HAProxy, que es la dirección por la que llegan todos
              los clientes) el NCT no puede renovar su lease ni sellar bloques, y
              los mineros no pueden reportar estado.
        - alert: VoxchainRabbitMQDegradado
          expr: >-
            max by (statefulset) (kube_statefulset_status_replicas_ready{namespace="voxchain", statefulset="rabbitmq"})
              < max by (statefulset) (kube_statefulset_replicas{namespace="voxchain", statefulset="rabbitmq"})
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "RabbitMQ perdió un nodo"
            description: >-
              RabbitMQ tiene {{ $value }} nodos listos, menos de los esperados,
              hace más de 1 minuto. Las colas son clásicas: las que vivían en
              el nodo caído quedan inaccesibles hasta que vuelva.
        - alert: VoxchainRabbitMQCaido
          expr: >-
            max by (statefulset) (kube_statefulset_status_replicas_ready{namespace="voxchain", statefulset="rabbitmq"}) == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "RabbitMQ sin nodos listos"
            description: >-
              No queda ningún nodo de RabbitMQ listo: no entran propuestas ni
              salen desafíos, y los mineros del k3s pierden la conexión AMQPS.
