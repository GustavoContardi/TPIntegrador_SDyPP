apiVersion: v1
kind: ConfigMap
metadata:
  name: voxchain-grafana-dashboard
  namespace: monitoring
  labels:
    # El sidecar de kube-prometheus-stack levanta los ConfigMap con este label.
    grafana_dashboard: "1"
data:
  voxchain-dashboard.json: |
    {
      "title": "VoxChain — Sistema Distribuido",
      "uid": "voxchain-v2",
      "version": 4,
      "timezone": "browser",
      "editable": true,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "tags": [
        "voxchain",
        "blockchain",
        "mining"
      ],
      "description": "VoxChain — NCT, API y mineros. Los mineros corren en el cluster k3s, fuera del alcance de Prometheus: sus paneles salen de voxchain_miner_*, que el API exporta a partir del latido worker:status en Redis.",
      "templating": {
        "list": [
          {
            "_comentario": [
              "El dashboard venia exportado con 'Export for sharing externally': los",
              "paneles apuntan a ${DS_PROMETHEUS}, que era un __inputs. Ese placeholder",
              "lo sustituye Grafana SOLO en el import manual por la UI. Aca lo provisiona",
              "el sidecar desde este ConfigMap, nadie lo importa: quedaba literal, no",
              "existia ninguna datasource con ese uid y TODOS los paneles fallaban.",
              "Como variable de tipo datasource, el mismo ${DS_PROMETHEUS} de los",
              "paneles resuelve en runtime y no hubo que tocar ni uno."
            ],
            "name": "DS_PROMETHEUS",
            "label": "Datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1,
            "hide": 0,
            "current": {}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CONSENSO — NCT",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "title": "Propuestas recibidas (total)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(voxchain_nct_proposals_total)",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "blue"
                  }
                ]
              },
              "unit": "short",
              "mappings": []
            }
          }
        },
        {
          "id": 3,
          "title": "Bloques sellados",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(voxchain_nct_blocks_sealed_total)",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 4,
          "title": "Ventanas abiertas (total)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "targets": [
            {
              "expr": "sum(voxchain_nct_windows_opened_total)",
              "refId": "A",
              "legendFormat": "ventanas"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 1,
                    "color": "yellow"
                  },
                  {
                    "value": 3,
                    "color": "red"
                  }
                ]
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "title": "NCT líder activo",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "targets": [
            {
              "expr": "max(voxchain_nct_is_leader)",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "value_and_name"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 1,
                    "color": "green"
                  }
                ]
              },
              "unit": "short",
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "Sin líder"
                    },
                    "1": {
                      "text": "Elegido"
                    }
                  },
                  "type": "value"
                }
              ]
            }
          }
        },
        {
          "id": 6,
          "title": "Throughput de propuestas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(rate(voxchain_nct_proposals_total[1m]))",
              "legendFormat": "propuestas/s"
            },
            {
              "expr": "sum(rate(voxchain_nct_blocks_sealed_total[1m]))",
              "legendFormat": "bloques sellados/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "spanNulls": false
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 7,
          "title": "Ritmo de apertura de ventanas",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 5
          },
          "targets": [
            {
              "expr": "sum(rate(voxchain_nct_windows_opened_total[1m]))",
              "refId": "A",
              "legendFormat": "ventanas/s"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 8,
          "title": "Validación de nonce en el NCT (p50 / p95)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(voxchain_nct_nonce_validation_seconds_bucket[5m])) by (le))",
              "refId": "A",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(voxchain_nct_nonce_validation_seconds_bucket[5m])) by (le))",
              "refId": "B",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "palette-classic"
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 7,
            "w": 24,
            "x": 0,
            "y": 13
          }
        },
        {
          "id": 54,
          "title": "Líder NCT por pod",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "targets": [
            {
              "expr": "max by (pod) (voxchain_nct_is_leader{job=\"nct\"})",
              "legendFormat": "{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true,
                "lineInterpolation": "stepAfter"
              },
              "min": 0,
              "max": 1
            }
          },
          "description": "1 = el pod tiene el lease de líder en Redis. Un cruce entre las dos líneas es un failover primary → standby."
        },
        {
          "id": 55,
          "title": "Bloques sellados por ventana (1h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 12,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum(increase(voxchain_nct_blocks_sealed_total[1h])) / clamp_min(sum(increase(voxchain_nct_windows_opened_total[1h])), 1)",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "red"
                  },
                  {
                    "value": 0.5,
                    "color": "orange"
                  },
                  {
                    "value": 0.9,
                    "color": "green"
                  }
                ]
              },
              "unit": "percentunit",
              "mappings": []
            }
          },
          "description": "Proporción de ventanas de votación de la última hora que terminaron en un bloque sellado."
        },
        {
          "id": 56,
          "title": "Propuestas por bloque (1h)",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 7,
            "w": 6,
            "x": 18,
            "y": 20
          },
          "targets": [
            {
              "expr": "sum(increase(voxchain_nct_proposals_total[1h])) / clamp_min(sum(increase(voxchain_nct_blocks_sealed_total[1h])), 1)",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "background",
            "graphMode": "none"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "purple"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "purple"
                  }
                ]
              },
              "unit": "short",
              "mappings": [],
              "decimals": 1
            }
          },
          "description": "Cuántas propuestas (votos) entran, en promedio, en cada bloque sellado."
        },
        {
          "id": 30,
          "title": "API — Gateway",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 27
          }
        },
        {
          "id": 31,
          "title": "Requests/s al API",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 28
          },
          "targets": [
            {
              "expr": "sum(rate(voxchain_api_http_requests_total[1m]))",
              "legendFormat": "__auto"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background",
            "graphMode": "area"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "blue"
              },
              "unit": "reqps"
            }
          }
        },
        {
          "id": 32,
          "title": "Latencia p50 / p90 / p99",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 4,
            "w": 18,
            "x": 6,
            "y": 28
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "graphMode": "none",
            "orientation": "horizontal"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "green"
                  },
                  {
                    "value": 0.1,
                    "color": "yellow"
                  },
                  {
                    "value": 0.5,
                    "color": "red"
                  }
                ]
              }
            }
          }
        },
        {
          "id": 33,
          "title": "HTTP Requests/s por ruta",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 32
          },
          "targets": [
            {
              "expr": "sum by (path) (rate(voxchain_api_http_requests_total[1m]))",
              "legendFormat": "{{path}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 8
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 34,
          "title": "Latencia HTTP (histograma p50/p90/p99)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 32
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p90"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(voxchain_api_http_request_duration_seconds_bucket[1m])) by (le))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 6
              },
              "color": {
                "mode": "palette-classic"
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 35,
          "title": "Requests por método HTTP",
          "type": "piechart",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 40
          },
          "targets": [
            {
              "expr": "sum by (method) (voxchain_api_http_requests_total)",
              "legendFormat": "{{method}}"
            }
          ],
          "options": {
            "pieType": "donut",
            "displayLabels": [
              "name",
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "value"
              ]
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              }
            }
          }
        },
        {
          "id": 57,
          "title": "Latencia p95 por ruta (sin health/metrics)",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 40
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, path) (rate(voxchain_api_http_request_duration_seconds_bucket{path!~\"/metrics|/api/health.*\"}[5m])))",
              "legendFormat": "{{path}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "s",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          }
        },
        {
          "id": 58,
          "title": "Requests/s por réplica del API",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 48
          },
          "targets": [
            {
              "expr": "sum by (pod) (rate(voxchain_api_http_requests_total[1m]))",
              "legendFormat": "{{pod}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "reqps",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never",
                "spanNulls": true
              }
            }
          },
          "description": "Sirve para ver que el Service reparte la carga entre las réplicas del HPA."
        },
        {
          "id": 59,
          "title": "Top 10 rutas en el rango (sin health/metrics)",
          "type": "bargauge",
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 48
          },
          "targets": [
            {
              "expr": "topk(10, sum by (path) (increase(voxchain_api_http_requests_total{path!~\"/metrics|/api/health.*\"}[$__range])))",
              "legendFormat": "{{path}}",
              "instant": true,
              "range": false
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "orientation": "horizontal",
            "displayMode": "gradient",
            "showUnfilled": true,
            "valueMode": "color"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "value": null,
                    "color": "blue"
                  }
                ]
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 40,
          "title": "MINEROS — k3s (latido en Redis, exportado por el API)",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 56
          }
        },
        {
          "id": 41,
          "title": "Mineros vivos",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
