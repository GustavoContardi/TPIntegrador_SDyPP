# Credenciales del push de logs de los mineros del k3s a Loki. Las dos salen de
# Secret Manager, donde las deja scripts/bootstrap-secrets.sh.

# El hash htpasswd que exige ingress-nginx para el basic auth del Ingress de
# logs (loki-push-ingress.yaml). Va en `monitoring`, junto al Ingress: la
# anotación auth-secret sólo busca en el namespace del propio Ingress.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-push-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: loki-push-auth
    creationPolicy: Owner
  data:
    # ingress-nginx lee la clave `auth`.
    - secretKey: auth
      remoteRef:
        key: loki-push-htpasswd
---
# La contraseña en claro, para el pipeline 04-gpu-workers: la copia al k3s como
# `loki-push-credentials`, igual que redis-credentials. Va en `voxchain` porque
# es el namespace donde el CI ya lee secretos.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: loki-push-credentials
  namespace: voxchain
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: loki-push-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: loki-push-password
