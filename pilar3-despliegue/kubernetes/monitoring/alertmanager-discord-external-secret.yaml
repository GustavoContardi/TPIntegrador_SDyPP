# URL del webhook de Discord al que Alertmanager manda las alertas
# (alertmanager-config.yaml). Es un secreto: con ella cualquiera puede escribir
# en el canal. La carga en Secret Manager scripts/bootstrap-secrets.sh, con la
# variable DISCORD_WEBHOOK_URL.
#
# Va en `monitoring` porque el operador sólo busca el Secret en el namespace del
# AlertmanagerConfig.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: alertmanager-discord
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: alertmanager-discord
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: alertmanager-discord-webhook
