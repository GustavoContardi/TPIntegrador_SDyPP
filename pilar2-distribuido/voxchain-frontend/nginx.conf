server {
    # 8080: puerto no privilegiado, permite correr nginx como usuario no-root
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad -------------------------------------------
    #
    # La identidad de un ciudadano es una clave privada que vive en este
    # navegador (AGENT.md 3.1). Está guardada como CryptoKey no extraíble, así
    # que un XSS no puede robarla — pero sí podría pedirle firmas mientras la
    # pestaña esté abierta. La CSP es la otra mitad de esa defensa: la que
    # intenta que no haya XSS en primer lugar.
    #
    # `script-src 'self'` sin 'unsafe-inline' ni 'unsafe-eval' es lo que
    # realmente detiene un XSS. Para poder ponerlo hay que compilar sin el
    # inliner de CSS crítico de Angular (`inlineCritical: false` en
    # angular.json), que si no inyecta un <style> y un `onload=` en el
    # index.html y obliga a aflojar la directiva.
    #
    # `style-src` sí lleva 'unsafe-inline': Angular Material inyecta <style> en
    # tiempo de ejecución (overlays, ripples) y no hay forma de evitarlo sin
    # nonces por request. Es un residuo mucho menor — con CSS no se ejecuta
    # JavaScript, así que la clave sigue fuera de alcance.
    #
    # connect-src 'self' alcanza porque el API se sirve por /api/ en este mismo
    # origen (ver el proxy de abajo): no hay ningún destino externo al que un
    # script inyectado pudiera exfiltrar algo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Trusted Types en modo reporte: elimina el DOM-XSS por asignación a
    # innerHTML y compañía. Va en Report-Only a propósito — hay que confirmar en
    # el navegador que Angular no reporta violaciones antes de exigirlo, porque
    # equivocarse acá deja una pantalla en blanco en vez de un error visible.
    add_header Content-Security-Policy-Report-Only "require-trusted-types-for 'script'; trusted-types angular" always;

    # El navegador no debe adivinar el tipo de un archivo: un .txt servido como
    # HTML sería un XSS almacenado.
    add_header X-Content-Type-Options "nosniff" always;
    # Redundante con frame-ancestors, para navegadores viejos.
    add_header X-Frame-Options "DENY" always;
    # Que la pubkey de una URL no se filtre a terceros por el Referer.
    add_header Referrer-Policy "same-origin" always;
    # No hay nada en la app que necesite cámara, micrófono ni ubicación.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Proxy API requests to voxchain-api
    location /api/ {
        proxy_pass http://voxchain-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve Angular app
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
