# VoxChain — Pilar 2. `docker compose up` levanta RabbitMQ, Redis, el NCT y
# workers en modo standalone (por defecto). El contexto de build es la raíz del
# repo (..) para que cada imagen pueda copiar el paquete `common` y, el worker,
# el minero CPU de Pilar 1.
name: voxchain-pilar2

x-app-env: &app-env
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  REDIS_URL: redis://redis:6379/0
  # Ver el ConfigMap de Pilar 3: n, NONCE_SPACE y la ventana de derogación
  # se mueven juntos. Recalcular con calibracion/calibrar_dificultad.py.
  N_ZEROS: "6"
  # Dificultad DINÁMICA (AGENT.md 3.6 / 11): `n` se recalcula en cada ventana
  # según el cómputo vivo, para que promulgar cueste siempre ~TARGET_SECONDS sin
  # importar cuántos mineros se registren. N_ZEROS pasa a ser sólo el valor
  # inicial. Con "false" vuelve al `n` fijo del enunciado original.
  DYNAMIC_DIFFICULTY: "true"
  DIFFICULTY_TARGET_SECONDS: "60"
  # Deliberación (AGENT.md 3.12): pausa entre anunciar la ley y abrir su
  # ventana, para que cada equipo convocado decida si aporta cómputo. La
  # dificultad y el plazo se congelan al anunciar, sobre el equipo más grande
  # que vota esa área; el plazo es FACTOR × su tiempo esperado.
  DELIBERATION_SECONDS: "120"
  WINDOW_DEADLINE_FACTOR: "2"
  WINDOW_MIN_SECONDS: "20"
  # Pausas seguidas sin ninguna respuesta antes de descartar la ley "sin
  # respuesta" (sin penalidad de reproposición). Corta el reanuncio infinito.
  MAX_SILENT_DELIBERATIONS: "3"
  # Ventanas seguidas midiendo una red más chica antes de bajar `n`. Sube en el
  # acto; baja despacio, porque bajar es lo único que le sirve a un atacante
  # (conectar cómputo, dejar subir n, apagarlo y promulgar barato). El estado del
  # trinquete vive en Redis (`nct:difficulty`) y sobrevive al failover del NCT:
  # sin eso, forzar una caída era la forma de saltearse la histéresis.
  DIFFICULTY_DECAY_WINDOWS: "3"
  # H/s a suponerle a un minero que todavía no reportó medición propia.
  HPS_CPU: "954180"
  HPS_GPU: "500000000"
  # Cuota de turnos por identidad (AGENT.md 3.3): una identidad que se llevó
  # más de MAX_SHARE de las últimas WINDOWS ventanas cede el turno. Acota el
  # monopolio sostenido; no cierra Sybil (AGENT.md 9).
  TURN_QUOTA_WINDOWS: "10"
  TURN_QUOTA_MAX_SHARE: "0.5"
  # Quórum de mineros para abrir una ventana. Si no hay al menos esta cantidad
  # de mineros vivos capaces de minar el ÁREA de la ley (un equipo que sólo vota
  # "economia" no cuenta para una ley de "salud"), el NCT no abre la ventana: la
  # ley se queda en la cola y el sistema se declara no disponible, en vez de
  # abrir una ventana que va a vencer sí o sí y descartar la ley por falta de
  # red. Tiene que ser el MISMO valor en NCT y API (el API sólo lo usa para
  # avisarle al ciudadano). 0 = desactivado (comportamiento previo).
  MIN_WORKERS_FOR_WINDOW: "1"
  # Si ese quórum mira la AGENDA de los equipos o sólo cuenta mineros vivos.
  # "true": una ley de un área que ningún equipo vota también espera en la cola.
  # "false": el gate cubre sólo la red vacía, y un área desierta vuelve a hacer
  # expirar la ley, que es el veto político deliberado de AGENT.md 3.10.
  QUORUM_BY_CATEGORY: "true"
  # Quién puede proponer leyes (AGENT.md 3.2). "true": sólo el fundador de un
  # equipo o el dueño de un minero standalone; un ciudadano sin minero o un
  # miembro de equipo reciben 403. "false": cualquier identidad, como antes (lo
  # necesitan los inyectores de carga, que proponen con identidades inventadas).
  # Compartido por NCT y API.
  RESTRICT_PROPOSERS: "true"
  NONCE_SPACE: "1250000000"
  # Techo de paralelismo de un pool: NONCE_SPACE/FRAGMENT_SIZE = 50 fragmentos.
  # Un equipo con más miembros que fragmentos NO va más rápido, así que este
  # cociente es la ventaja máxima que puede sacarle el pool más grande a un
  # minero solo. Subirlo ensancha la concentración de poder (AGENT.md 9).
  FRAGMENT_SIZE: "25000000"
  HEALTH_PORT: "8080"
  # Firma de propuestas (A-01). "false" = migración (acepta no firmadas, rechaza
  # firmas inválidas); "true" = rechazo duro. Compartido por NCT y API vía el anchor.
  REQUIRE_SIGNATURES: "false"
  PROPOSAL_MAX_AGE_SECONDS: "300"

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  coordinator:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      # Techos: el plazo real lo congela la deliberación.
      WINDOW_SECONDS_PROMULGACION: "120"
      WINDOW_SECONDS_DEROGACION: "1200"
      NCT_MODE: "primary"
      NCT_ID: "nct-primary"
      HEARTBEAT_INTERVAL: "3"
      HEARTBEAT_TIMEOUT: "12"
      LEADER_LEASE_TTL: "15"
    ports:
      - "8081:8080"   # health endpoint del NCT

  coordinator-standby:
    build:
      context: ..
      dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_MODE: "standby"
      NCT_ID: "nct-standby-1"
      HEARTBEAT_INTERVAL: "3"
      HEARTBEAT_TIMEOUT: "12"
      LEADER_LEASE_TTL: "15"

  worker-1:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Reporta su estado a Redis, y lo necesita si el usuario lo promueve a
      # coordinador de un equipo (lease de liderazgo y política de voto).
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "standalone"
      WORKER_CAPACITY: "1"
      WORKER_ID: "worker-1"
      # Dirección con la que otros mineros lo alcanzan si coordina un equipo.
      # Se explicita porque el hostname del contenedor no tiene por qué coincidir
      # con el WORKER_ID, y adivinarla mal deja al equipo sin poder formarse.
      WORKER_ADDRESS: "http://worker-1:9001"
    ports:
      - "9091:9090"

  worker-2:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Reporta su estado a Redis, y lo necesita si el usuario lo promueve a
      # coordinador de un equipo (lease de liderazgo y política de voto).
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "standalone"
      WORKER_CAPACITY: "1"
      WORKER_ID: "worker-2"
      # Dirección con la que otros mineros lo alcanzan si coordina un equipo.
      # Se explicita porque el hostname del contenedor no tiene por qué coincidir
      # con el WORKER_ID, y adivinarla mal deja al equipo sin poder formarse.
      WORKER_ADDRESS: "http://worker-2:9001"
    ports:
      - "9092:9090"

  worker-pool-coordinator:
    build:
      context: ..
      dockerfile: pilar2-distribuido/worker/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      WORKER_MODE: "pool-coordinator"
      WORKER_ID: "pool-coordinator-1"
      # Dificultad del mini-PoW de elección de coordinador. Es el nombre que
      # leen bully.py y pool_coordinator/coordinator.py; NO es N_ZEROS (la
      # dificultad de gobierno), que sale del ConfigMap/env compartido.
      POOL_ELECTION_N_ZEROS: "2"
      POOL_HTTP_PORT: "9001"
      # El WORKER_ID (pool-coordinator-1) NO es el nombre del servicio, así que
      # sin esto la dirección publicada no resolvería para nadie.
      WORKER_ADDRESS: "http://worker-pool-coordinator:9001"
    ports:
      - "9090:9090"   # Admin server para hot-switch
      - "9001:9001"   # HTTP para pool-workers

  voxchain-api:
    build:
      context: ..
      dockerfile: pilar2-distribuido/voxchain_api/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-env
      NCT_HEALTH_URL: http://coordinator:8080/health
      PORT: "8000"
      # Registrar un minero desde la UI lo levanta como contenedor (un clon de
      # worker-1 con otra identidad), igual que en Kubernetes se crea un pod.
      # Necesita el socket de Docker, que le da al API control del host: vale
      # para este compose de desarrollo y en ningún otro lado. Con "false" se
      # vuelve al camino manual (`./run.sh worker <id>`).
      DOCKER_SPAWN_ENABLED: "true"
      DOCKER_COMPOSE_PROJECT: voxchain-pilar2
      DOCKER_WORKER_TEMPLATE_SERVICE: worker-1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"

  voxchain-frontend:
    build:
      context: voxchain-frontend
      dockerfile: Dockerfile
    ports:
      - "4200:8080"
    depends_on:
      - voxchain-api

volumes:
  redis-data:
