name: "P3 - 02: Deploy Infrastructure"
on:
  push:
    branches: [main]
    paths:
      - "pilar3-despliegue/kubernetes/infrastructure/**"
      # Los ClusterIssuer y el namespace también los aplica este workflow, así
      # que tienen que poder dispararlo.
      - "pilar3-despliegue/kubernetes/cert-manager/**"
      - "pilar3-despliegue/kubernetes/namespace.yaml"
  workflow_dispatch:

env:
  K8S_DIR: pilar3-despliegue/kubernetes
  PROJECT_ID: voxchain-unlu
  # Identidad de los workers del clúster externo. Tiene que coincidir con el
  # username de gpu-cluster/rabbitmq-credentials-secret.yaml y con el secret
  # RABBITMQ_USER del repo.
  WORKER_USER: voxchain-worker

jobs:
  deploy:
    name: Deploy Redis + RabbitMQ
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: voxchain
          location: southamerica-east1-a

      # Los ExternalSecret de infrastructure/ leen estos secretos de GCP Secret
      # Manager. Si faltan, los StatefulSets arrancan sin credenciales y el
      # fallo aparece mucho después y sin relación aparente. Mejor cortar acá.
      # Se crean una sola vez por entorno con scripts/bootstrap-secrets.sh.
      - name: Check bootstrap secrets exist
        run: |
          # Se distingue "no existe" de "no puedo consultarlo": si se tragan los
          # errores de permiso, una SA sin roles/secretmanager.viewer reporta
          # los 7 como faltantes y manda a recrear secretos que ya están.
          FALTAN=""
          for s in rabbitmq-ca-crt rabbitmq-tls-crt rabbitmq-tls-key \
                   rabbitmq-user rabbitmq-pass rabbitmq-erlang-cookie redis-pass; do
            SALIDA="$(gcloud secrets describe "$s" \
              --project="${{ env.PROJECT_ID }}" 2>&1 >/dev/null)" && continue
            case "$SALIDA" in
              *PERMISSION_DENIED*|*"does not have"*|*Forbidden*)
                echo "::error::Sin permiso para consultar Secret Manager."
                echo "La SA de CI necesita roles/secretmanager.viewer (está en el Terraform)."
                echo "$SALIDA"
                exit 1
                ;;
            esac
            FALTAN="$FALTAN $s"
          done
          if [ -n "$FALTAN" ]; then
            echo "::error::Faltan secretos en Secret Manager:$FALTAN"
            echo "Creálos con: pilar3-despliegue/kubernetes/scripts/bootstrap-secrets.sh"
            exit 1
          fi
          echo "Los 7 secretos están presentes."

      - name: Create namespace
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/namespace.yaml

      - name: Deploy infrastructure
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/infrastructure/

      # Los ClusterIssuer de Let's Encrypt. El controlador de cert-manager lo
      # instala OpenTofu (01-infra); acá van sólo los Issuer, que dependen de
      # sus CRDs y por eso no pueden vivir en el Terraform.
      - name: Deploy cert-manager issuers
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/cert-manager/

      # rollout status y no `wait --for=condition=available`: esa condición
      # existe en Deployments, no en StatefulSets — la versión anterior de este
      # paso no podía pasar nunca.
      - name: Verify deployments
        run: |
          kubectl rollout status -n voxchain statefulset/rabbitmq --timeout=180s
          kubectl rollout status -n voxchain statefulset/redis --timeout=180s

      # La API crea y borra Deployments de mineros en el clúster k3s externo
      # cuando un usuario registra o da de baja un worker desde la web
      # ("Register Worker"). Para eso monta este kubeconfig; el manifest lo
      # declara `optional: true`, así que sin el secreto la API arranca igual
      # pero cae al contexto in-cluster —GKE— y el spawn apunta al clúster
      # equivocado. Se creaba a mano y se perdió en el teardown.
      - name: Deploy k3s kubeconfig for dynamic worker spawning
        env:
          K3S_KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          if [ -z "$K3S_KUBECONFIG_B64" ]; then
            echo "::error::Falta el secret K3S_KUBECONFIG del repositorio."
            exit 1
          fi
          printenv K3S_KUBECONFIG_B64 | base64 -d > /tmp/k3s-kubeconfig
          kubectl create secret generic k3s-kubeconfig \
            --namespace voxchain \
            --from-file=kubeconfig=/tmp/k3s-kubeconfig \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/k3s-kubeconfig
          kubectl get secret k3s-kubeconfig -n voxchain -o name

      # Identidad separada para los workers del clúster externo. El StatefulSet
      # sólo crea el usuario administrador de RABBITMQ_DEFAULT_USER; éste estaba
      # declarado en el secret del k3s (gpu-cluster/rabbitmq-credentials-secret)
      # pero no lo creaba nadie, así que al recrear la infraestructura los
      # workers recibían ACCESS_REFUSED y nadie minaba.
      #
      # La contraseña se toma de la variable de entorno del propio pod, en vez
      # de leerla acá y pasarla como argumento: así no atraviesa el runner ni
      # queda en los logs de Actions. Idempotente: si el usuario ya existe,
      # add_user falla y se le actualiza la contraseña.
      - name: Ensure external worker user
        run: |
          # El paso anterior puede haber disparado un reinicio rodante del
          # StatefulSet, así que primero se espera a que el nodo atienda.
          kubectl exec -n voxchain rabbitmq-0 -- rabbitmqctl await_startup --timeout 120

          # ${{ env.WORKER_USER }} lo sustituye GitHub antes de que exista el
          # shell; $RABBITMQ_DEFAULT_PASS queda literal y lo expande el pod.
          # Sin pipe a `tail`: el código de salida tiene que ser el de
          # rabbitmqctl y no el del pipe, o un fallo pasa por verde.
          kubectl exec -n voxchain rabbitmq-0 -- sh -c '
            set -e
            rabbitmqctl add_user ${{ env.WORKER_USER }} "$RABBITMQ_DEFAULT_PASS" \
              || rabbitmqctl change_password ${{ env.WORKER_USER }} "$RABBITMQ_DEFAULT_PASS"
            rabbitmqctl set_permissions --vhost / ${{ env.WORKER_USER }} ".*" ".*" ".*"
          '

          # Verificación explícita: que el usuario exista no alcanza, porque sin
          # permisos sobre el vhost el login falla igual.
          kubectl exec -n voxchain rabbitmq-0 -- rabbitmqctl list_permissions \
            | grep -q "^${{ env.WORKER_USER }}" \
            || { echo "::error::${{ env.WORKER_USER }} quedó sin permisos en el vhost /"; exit 1; }
          echo "${{ env.WORKER_USER }} con permisos en /"
