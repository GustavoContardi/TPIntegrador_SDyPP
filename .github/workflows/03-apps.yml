name: "P3 - 03: Build & Deploy Apps"
on:
  push:
    branches: [main]
    paths:
      - "pilar2-distribuido/common/**"
      - "pilar2-distribuido/nct-coordinator/**"
      - "pilar2-distribuido/voxchain_api/**"
      - "pilar2-distribuido/voxchain-frontend/**"
      - "pilar2-distribuido/worker/**"
      # worker-gpu compila el kernel CUDA desde acá (ver Dockerfile.gpu), así que
      # un cambio en el .cu también tiene que rebuildear la imagen.
      - "pilar1-minero/gpu/**"
  workflow_dispatch:

env:
  REGION: southamerica-east1
  ZONE: southamerica-east1-a
  PROJECT_ID: voxchain-unlu
  REGISTRY: southamerica-east1-docker.pkg.dev/voxchain-unlu/voxchain-images
  K8S_DIR: pilar3-despliegue/kubernetes

jobs:
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service:
          - name: nct
            dockerfile: pilar2-distribuido/nct-coordinator/Dockerfile
            context: .
          - name: worker
            dockerfile: pilar2-distribuido/worker/Dockerfile
            context: .
          # Imagen de los workers del clúster k3s (todos los manifests de
          # kubernetes/gpu-cluster/ la referencian). Sólo se buildea y pushea:
          # el despliegue lo hace 04-gpu-workers contra el otro clúster.
          # Compila con nvcc, pero NO necesita GPU en el runner.
          - name: worker-gpu
            dockerfile: pilar2-distribuido/worker/Dockerfile.gpu
            context: .
          - name: voxchain-api
            dockerfile: pilar2-distribuido/voxchain_api/Dockerfile
            context: .
          - name: voxchain-frontend
            dockerfile: pilar2-distribuido/voxchain-frontend/Dockerfile
            context: pilar2-distribuido/voxchain-frontend

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build & Push
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ matrix.service.name }}:${{ github.sha }}"
          docker build -f ${{ matrix.service.dockerfile }} \
            -t "$IMAGE" \
            -t "${{ env.REGISTRY }}/${{ matrix.service.name }}:latest" \
            ${{ matrix.service.context }}
          docker push "$IMAGE"
          docker push "${{ env.REGISTRY }}/${{ matrix.service.name }}:latest"

  # El deploy va en un job aparte y no dentro de la matriz por dos razones:
  # aplicar los manifests una vez por servicio sería redundante y propenso a
  # carreras, y sobre un clúster recién creado los Deployments no existen —
  # `kubectl set image` fallaría. Corriendo después del build, las imágenes ya
  # están en el registry cuando se aplican los manifests, así que los pods no
  # pasan por ImagePullBackOff.
  deploy:
    name: Deploy to GKE
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: voxchain
          location: ${{ env.ZONE }}

      # Deployments, Services, ConfigMap e Ingress de las apps. Hasta ahora
      # ningún workflow los aplicaba: se hacía a mano, así que un clúster
      # recreado desde cero quedaba sin las apps.
      - name: Apply application manifests
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/applications/

      - name: Apply HPAs
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/hpa/

      # ServiceMonitors, reglas de alerta y dashboard. Dependen de los CRDs de
      # kube-prometheus-stack, que instala OpenTofu en 01-infra.
      - name: Apply monitoring
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/monitoring/

      # Fija la imagen al SHA del commit en vez de :latest, para que el rollout
      # sea trazable y reproducible.
      - name: Pin images to this commit
        run: |
          kubectl set image -n voxchain deployment/nct-primary \
            nct=${{ env.REGISTRY }}/nct:${{ github.sha }}
          kubectl set image -n voxchain deployment/nct-standby \
            nct=${{ env.REGISTRY }}/nct:${{ github.sha }}
          kubectl set image -n voxchain deployment/voxchain-api \
            api=${{ env.REGISTRY }}/voxchain-api:${{ github.sha }}
          kubectl set image -n voxchain deployment/voxchain-frontend \
            frontend=${{ env.REGISTRY }}/voxchain-frontend:${{ github.sha }}

      - name: Verify rollout
        run: |
          for d in nct-primary nct-standby voxchain-api voxchain-frontend; do
            kubectl rollout status -n voxchain deployment/$d --timeout=180s
          done
