name: "P3 - 04: Deploy GPU Workers"
on:
  push:
    branches: [main]
    paths:
      - "pilar3-despliegue/kubernetes/gpu-cluster/**"
  workflow_dispatch:

env:
  K8S_DIR: pilar3-despliegue/kubernetes/gpu-cluster
  NAMESPACE: g-git-push-cv
  REGION: southamerica-east1
  ZONE: southamerica-east1-a
  PROJECT_ID: voxchain-unlu
  # Este workflow habla con DOS clústers y por eso cada paso declara contra cuál
  # va. `get-gke-credentials` exporta KUBECONFIG apuntando a su propio archivo,
  # que pisa cualquier ~/.kube/config escrito antes: sin un KUBECONFIG explícito,
  # los pasos que creen estar hablándole al k3s le hablan a GKE. Pasó: el
  # namespace y los secretos del k3s se crearon dentro de GKE.
  K3S_KUBECONFIG_PATH: /home/runner/.kube/k3s.yaml

jobs:
  deploy:
    name: Deploy Workers to k3s
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      # A un archivo propio, no a ~/.kube/config: ese lo pisa el paso de GKE.
      # Y por variable de entorno en vez de interpolar el secreto en el script,
      # para que su contenido no quede en la línea de comando del runner.
      - name: Configure kubectl for k3s
        env:
          K3S_KUBECONFIG_B64: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          mkdir -p "$(dirname "${{ env.K3S_KUBECONFIG_PATH }}")"
          printenv K3S_KUBECONFIG_B64 | base64 -d > "${{ env.K3S_KUBECONFIG_PATH }}"
          chmod 600 "${{ env.K3S_KUBECONFIG_PATH }}"

      - id: auth
        name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: voxchain
          location: ${{ env.ZONE }}

      # Los workers viven fuera de esta VPC, así que necesitan las IPs de los
      # Services LoadBalancer, no las internas. `rabbitmq` es headless (sin
      # ingress) y `redis` es ClusterIP: ninguna de las dos es alcanzable desde
      # el clúster externo. Los servicios expuestos son los `-external`.
      # Si falta alguna, se corta acá: un valor vacío o un placeholder produce
      # pods que crashean con un error de DNS a los tres minutos, mucho más
      # lejos de la causa.
      - name: Get RabbitMQ LoadBalancer IP
        id: rabbitmq
        run: |
          IP=$(kubectl get svc -n voxchain rabbitmq-external \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [[ -z "$IP" ]]; then
            echo "::error::rabbitmq-external todavía no tiene IP de LoadBalancer."
            exit 1
          fi
          echo "RABBITMQ_HOST=$IP" >> $GITHUB_OUTPUT

      - name: Get Redis LoadBalancer IP
        id: redis
        run: |
          IP=$(kubectl get svc -n voxchain redis-external \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "")
          if [[ -z "$IP" ]]; then
            echo "::error::redis-external todavía no tiene IP de LoadBalancer."
            exit 1
          fi
          echo "REDIS_HOST=$IP" >> $GITHUB_OUTPUT

      # --- De acá en adelante, todo va al k3s ---------------------------------

      # En el k3s del profesor el namespace ya viene creado y nuestra
      # ServiceAccount está confinada a él: no puede crear namespaces ni
      # parchear el propio. Se intenta aplicarlo igual —para que el workflow
      # sirva en un clúster propio— pero si el permiso no está, alcanza con
      # comprobar que exista.
      - name: Ensure namespace
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          if kubectl apply -f ${{ env.K8S_DIR }}/namespace.yaml 2>/dev/null; then
            exit 0
          fi
          echo "::warning::Sin permiso para aplicar el namespace; se verifica que exista."
          kubectl get namespace ${{ env.NAMESPACE }} -o name

      - name: Configure RabbitMQ and Redis hosts
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          kubectl create configmap worker-config \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=rabbitmq-host="${{ steps.rabbitmq.outputs.RABBITMQ_HOST }}" \
            --from-literal=redis-host="${{ steps.redis.outputs.REDIS_HOST }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy secrets
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
          RABBITMQ_USER: ${{ secrets.RABBITMQ_USER }}
          RABBITMQ_PASS: ${{ secrets.RABBITMQ_PASS }}
          RABBITMQ_CA: ${{ secrets.RABBITMQ_CA_CERT }}
          RABBITMQ_HOST: ${{ steps.rabbitmq.outputs.RABBITMQ_HOST }}
        run: |
          kubectl create secret generic rabbitmq-ca \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=ca.crt="${RABBITMQ_CA}" \
            --dry-run=client -o yaml | kubectl apply -f -

          KEDA_HOST="amqps://${RABBITMQ_USER}:${RABBITMQ_PASS}@${RABBITMQ_HOST}:5671/"
          kubectl create secret generic rabbitmq-credentials \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=username="${RABBITMQ_USER}" \
            --from-literal=password="${RABBITMQ_PASS}" \
            --from-literal=keda-host="${KEDA_HOST}" \
            --dry-run=client -o yaml | kubectl apply -f -

      # El configmap sí es requisito y el clúster nos deja crearlo.
      # Los workers reportan su estado a Redis, que es lo único que comparten
      # los dos clústers. El pipeline creaba los secretos de RabbitMQ pero no
      # éste: quedaba el de julio, con la contraseña anterior, y las escrituras
      # fallaban con AuthenticationError. El fallo era invisible porque el
      # worker lo registra en nivel debug, y se manifestaba lejos de su causa,
      # como `workers: unknown` en el endpoint de estado.
      #
      # Se copia desde GKE en vez de agregar otro secret al repositorio: ahí lo
      # sincroniza External Secrets desde Secret Manager, así que es la fuente
      # de verdad y no puede quedar desincronizado.
      - name: Deploy Redis credentials to k3s
        run: |
          PASS="$(kubectl get secret redis-credentials -n voxchain \
            -o jsonpath='{.data.password}' | base64 -d)"
          if [ -z "$PASS" ]; then
            echo "::error::No se pudo leer redis-credentials del clúster de GKE."
            exit 1
          fi
          kubectl --kubeconfig "${{ env.K3S_KUBECONFIG_PATH }}" \
            create secret generic redis-credentials \
            --namespace ${{ env.NAMESPACE }} \
            --from-literal=password="$PASS" \
            --dry-run=client -o yaml \
            | kubectl --kubeconfig "${{ env.K3S_KUBECONFIG_PATH }}" apply -f -

      - name: Deploy configmaps
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/worker-modes-configmap.yaml

      # El k3s es de un tercero y nuestra ServiceAccount no puede crear
      # ServiceAccounts, Roles ni RoleBindings ahí (verificado con
      # `kubectl auth can-i`). No es bloqueante: ningún manifest de este
      # directorio declara `serviceAccountName`, así que los pods corren con la
      # SA `default` y estos objetos no los usa nadie hoy. Se intenta igual —
      # por si el permiso existe en otro entorno— pero un Forbidden no corta el
      # despliegue.
      - name: Deploy RBAC (best-effort, el clúster puede no permitirlo)
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          for f in worker-rbac.yaml backend-proxy-rbac.yaml; do
            if ! SALIDA="$(kubectl apply -f "${{ env.K8S_DIR }}/$f" 2>&1)"; then
              case "$SALIDA" in
                *orbidden*)
                  echo "::warning::Sin permiso para aplicar $f en el clúster externo; se omite."
                  echo "$SALIDA"
                  ;;
                *)
                  echo "$SALIDA"; exit 1 ;;
              esac
            else
              echo "$SALIDA"
            fi
          done

      - name: Deploy demo worker nodes (5 nodes for demo scenario)
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          kubectl apply -f ${{ env.K8S_DIR }}/demo-deployments.yaml

      - name: Verify deployments
        env:
          KUBECONFIG: ${{ env.K3S_KUBECONFIG_PATH }}
        run: |
          for deploy in worker-standalone worker-pool-coordinator worker-pool-miner-1 worker-pool-miner-2 worker-pool-miner-3; do
            kubectl rollout status \
              -n ${{ env.NAMESPACE }} \
              deployment/$deploy \
              --timeout=120s
          done
